# O Alertmanager recebe os alertas do Prometheus, agrupa e entrega.
route:
  receiver: webhook
  group_by: [alertname, severity]   # alertas iguais viram uma notificação só
  group_wait: 10s                   # espera 10 s para juntar alertas do mesmo grupo
  group_interval: 10s               # intervalo mínimo entre notificações do mesmo grupo
  repeat_interval: 1m               # reenvia enquanto o alerta continuar ativo

receivers:
  - name: webhook
    webhook_configs:
      - url: http://webhook:5001/alerts
        send_resolved: true         # avisa também quando o alerta se resolve
