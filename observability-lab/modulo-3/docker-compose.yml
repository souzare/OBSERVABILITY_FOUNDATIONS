name: modulo-3

services:
  # ---------- Aplicação (gera logs, métricas e traces) ----------
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && node app.js"
    init: true
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./app.js:/app/app.js:ro
      - ./tracing.js:/app/tracing.js:ro
      - ./package.json:/app/package.json:ro
      - node_modules:/app/node_modules
    depends_on:
      - jaeger

  # ---------- TRACES: Jaeger (UI + coletor) ----------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # recebe traces (OTLP/HTTP)

  # ---------- MÉTRICAS: Prometheus ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # ---------- Dashboards: Grafana ----------
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus

  # ---------- Gerador de tráfego (opcional, para quem não tem Node instalado) ----------
  # Uso: docker compose run --rm load
  load:
    image: node:22-alpine
    profiles: ["load"]
    working_dir: /app
    command: node load.js
    init: true
    environment:
      BASE_URL: http://app:3000
    volumes:
      - ./load.js:/app/load.js:ro

volumes:
  node_modules:
