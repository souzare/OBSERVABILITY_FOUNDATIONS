AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Observability Foundations - Modulo 3. Uma instancia EC2 que clona o repositorio
  e sobe a demo (checkout-api + Jaeger + Prometheus + Grafana) com Docker Compose.

Parameters:
  AllowedCidr:
    Type: String
    Description: Faixa de IP que pode acessar a demo (ex. 203.0.113.10/32). Use 0.0.0.0/0 para liberar a todos.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  RepoUrl:
    Type: String
    Default: https://github.com/souzare/OBSERVABILITY_FOUNDATIONS.git
    Description: Repositorio Git (publico) com o codigo da demo
  RepoBranch:
    Type: String
    Default: main
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # Libera apenas as portas das interfaces web, e apenas para o AllowedCidr.
  # Nao ha SSH: o acesso ao terminal e feito pelo Session Manager.
  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OBSF Modulo 3 - acesso as UIs da demo
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, CidrIp: !Ref AllowedCidr, Description: checkout-api }
        - { IpProtocol: tcp, FromPort: 3001, ToPort: 3001, CidrIp: !Ref AllowedCidr, Description: Grafana }
        - { IpProtocol: tcp, FromPort: 9090, ToPort: 9090, CidrIp: !Ref AllowedCidr, Description: Prometheus }
        - { IpProtocol: tcp, FromPort: 16686, ToPort: 16686, CidrIp: !Ref AllowedCidr, Description: Jaeger UI }

  DemoRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DemoRole]

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DemoInstanceProfile
      SecurityGroupIds: [!GetAtt DemoSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 20, VolumeType: gp3 }
      Tags:
        - { Key: Name, Value: obsf-modulo-3 }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Log da instalacao: /var/log/cloud-init-output.log
          set -euxo pipefail

          dnf install -y docker git
          systemctl enable --now docker

          # Plugin do Docker Compose (nao vem no repositorio do Amazon Linux 2023)
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          git clone --depth 1 --branch ${RepoBranch} ${RepoUrl} /opt/obsf
          cd /opt/obsf/observability-lab/modulo-3
          ./start.sh

Outputs:
  AppUrl:
    Value: !Sub http://${DemoInstance.PublicDnsName}:3000
  JaegerUrl:
    Value: !Sub http://${DemoInstance.PublicDnsName}:16686
  PrometheusUrl:
    Value: !Sub http://${DemoInstance.PublicDnsName}:9090
  GrafanaUrl:
    Value: !Sub http://${DemoInstance.PublicDnsName}:3001
  InstanceId:
    Value: !Ref DemoInstance
  TerminalUrl:
    Description: Terminal da instancia no navegador (Session Manager)
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${DemoInstance}?region=${AWS::Region}
